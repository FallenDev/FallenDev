# GitHub profile metrics
# Documentation:
# https://github.com/lowlighter/metrics

name: Metrics

on:
  # Update once per day at 12:00 UTC.
  schedule:
    - cron: "0 12 * * *"

  # Allow manual execution from the Actions tab.
  workflow_dispatch:

  # Refresh metrics when the profile repository changes.
  push:
    branches:
      - main

concurrency:
  group: github-profile-metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    environment: production

    permissions:
      contents: write

    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          # PAT used only for collecting GitHub metrics.
          token: ${{ secrets.METRICS }}

          # The action already uses the repository-scoped GITHUB_TOKEN
          # for committing generated metrics.
          user: FallenDev

          filename: github-metrics.svg
          template: classic

          # Core account/activity information.
          base: header, activity
          base_indepth: yes

          config_timezone: America/New_York
          config_order: base.header, isocalendar, languages, base.activity

          # Full-year contribution calendar.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Language statistics.
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_categories: markup, programming, data
          plugin_languages_sections: most-used
          plugin_languages_limit: 5
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage

          # Bounds for repository language analysis.
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
